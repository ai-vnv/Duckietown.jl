name: VnV

# The vnvspec composite action assumes an assessment report produced by its
# pytest plugin; this repository's requirements are verified by the Julia
# suite instead, so the action's export step has nothing to read (measured:
# it failed, generated no badge, and published the whole checkout to
# gh-pages). This workflow does the two things that ARE meaningful here:
#
#   1. `vnvspec validate` — the GtWR quality gate on the spec itself. This
#      one fails the workflow on regressions, and caught 16 statement
#      violations on its first run.
#   2. A Shields endpoint with a real verification count ("10/10 pass"):
#      each requirement carries testset_prefixes in its metadata, and this
#      workflow checks those testsets in the committed release-grade report
#      (artifacts/fj9/test_report.json — written by the full suite run with
#      the reference installed, and policed by the FJ9.9b sum check and the
#      artifact ledger). The workflow VERIFIES the count rather than
#      asserting it, and fails loudly if any mapped testset is missing or
#      not green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vnvspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vnvspec
        run: pip install vnvspec pyyaml
      - name: Validate the spec (GtWR quality gate)
        run: vnvspec validate .vnvspec/spec.yaml
      - name: Verify each requirement against the committed suite report
        run: |
          python - <<'PY'
          import json, yaml, pathlib, sys
          spec = yaml.safe_load(pathlib.Path(".vnvspec/spec.yaml").read_text())
          report = json.loads(pathlib.Path("artifacts/fj9/test_report.json").read_text())
          rows = report["testsets_detail"]
          reqs = spec["requirements"]
          passed = []
          for r in reqs:
              prefixes = r["metadata"]["testset_prefixes"]
              hits = [x for x in rows
                      if any(x["name"].startswith(p) for p in prefixes)]
              ok = bool(hits) and all(x["fails"] == 0 and x["errors"] == 0
                                      for x in hits)
              print(f"{r['id']}: {len(hits)} testsets, {'PASS' if ok else 'FAIL'}")
              if ok:
                  passed.append(r["id"])
          n, k = len(reqs), len(passed)
          pathlib.Path("badge").mkdir(exist_ok=True)
          pathlib.Path("badge/vnv-badge.json").write_text(json.dumps({
              "schemaVersion": 1,
              "label": "V&V",
              "message": f"{k}/{n} pass",
              "color": "brightgreen" if k == n else "red",
          }))
          # A regression in the mapping or the report is a workflow failure,
          # not a quietly red badge nobody looks at.
          sys.exit(0 if k == n else 1)
          PY
      - name: Publish the badge endpoint to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badge
          destination_dir: .
          keep_files: true
