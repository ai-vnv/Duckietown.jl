name = "DuckietownDecisionModels"
uuid = "b9206cf4-d873-49ff-bdb0-b4cd6bc56877"
authors = ["Pannntastic"]
version = "0.1.0"

[deps]
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
POMDPs = "a93abf59-7444-517b-a68a-c42f96afdd7d"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"

# PythonCall is a WEAK dependency: it powers only the FJ5-R in-process
# reference backend (`ext/DuckietownPythonCallExt.jl`). It must NEVER appear
# in [deps] — `using DuckietownDecisionModels` has to work with no Python
# installed at all. It is additionally listed under [extras] so `Pkg.test()`
# can exercise the extension.
#
# MCTS is a WEAK dependency for the same structural reason, made explicit in
# FJ8: this package is a MODEL, and a solver must never become part of its
# identity. `using DuckietownDecisionModels` has to work with no planning
# library installed, and removing MCTS must change nothing about the model,
# the reward, the evaluator or the four learned baselines. MCTS.jl is the
# FIRST external solver integrated, not the solver this package is built for;
# further solvers get further extensions, never entries in [deps].
#
# Makie is a WEAK dependency for the third time, and for the same reason: a
# plotting library must not be required to USE the model. FJ9 computes every
# coordinate in the core and lets `ext/DuckietownMakieExt.jl` draw it, so the
# geometry is testable with no backend installed. The extension triggers on
# `Makie`, so any backend activates it; the project standardises on CairoMakie
# because it renders on the CPU and needs no display.
[weakdeps]
MCTS = "e12ccd36-dcad-5f33-8774-9175229e7b33"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"

[extensions]
DuckietownMCTSExt = "MCTS"
DuckietownMakieExt = "Makie"
DuckietownPythonCallExt = "PythonCall"

[compat]
JSON3 = "1"
LinearAlgebra = "1"
MCTS = "0.5"
# Narrowed to the version actually validated: FJ9.1 uses `arrows2d!`, which
# replaced the deprecated `arrows` recipe. A wider range would be a claim
# about versions this repository has never rendered with.
Makie = "0.24"
POMDPs = "1"
# Pinned to the EXACT version validated in FJ5-R against the reference
# interpreter (Julia 1.11.3 / Python 3.9.25 / numpy 1.20.0). Newer PythonCall
# releases eventually require Python >= 3.10 ("Only Python 3.10+ is
# supported"), and `ddm-ref` must not be upgraded. A wider range would be
# historically defensible (0.9.28 is still a Python-3.9 era release), but
# reproducibility is better served by standardising on the tested version;
# 0.9.28 can be revisited later as a compatibility check, not as a blocker.
PythonCall = "=0.9.25"
Random = "1"
YAML = "0.4"
julia = "1.10"

# Test-only. POMDPLinter is the ecosystem's own solver-requirements checker;
# FJ8.2 runs it against this model and keeps the output as an artefact, so the
# compatibility claim rests on the ecosystem's verdict rather than on ours.
# It is NOT a dependency of the package.
[extras]
MCTS = "e12ccd36-dcad-5f33-8774-9175229e7b33"
POMDPLinter = "f3bd98c0-eb40-45e2-9eb1-f2763262d755"
PythonCall = "6099a3de-0909-46bc-b1f4-468b9a2dfc0d"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "PythonCall", "MCTS", "POMDPLinter"]
