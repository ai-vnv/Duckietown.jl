# FJ8 planning experiments — the seed sets, frozen and version-controlled so
# every run is reproducible and so configuration choices can never be made on
# the seeds that will be reported.
#
# The split is the point:
#
#   development  used by the FJ8.4a budget study and by ANY choice of
#                exploration constant, depth, widening coefficients or budget.
#   evaluation   used ONLY by the FJ8.4b six-solver comparison. A configuration
#                must be frozen before these are run.
#
# The two sets are disjoint by construction. Nothing in FJ8.4a may read the
# evaluation list, and FJ8.4b may not re-tune anything after reading it.

development:
  # spawn seeds for the probe states used in the cost-search curve
  states: [101, 102, 103, 104, 105]
  # planner RNG seeds; the search is deterministic per seed, so repeats
  # measure timing noise rather than a different search
  planner: [201, 202]

evaluation:
  # episode seeds for the six-solver comparison. Twenty, fixed.
  episodes: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
             1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020]
  # one planner seed per solver, so a planner's own randomness is fixed across
  # the whole comparison rather than varying per episode
  planner: 2026
  # decision horizon per episode, identical for every solver
  max_steps: 150
