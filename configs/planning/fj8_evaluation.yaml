# FJ8.4b — the frozen evaluation protocol.
#
# Everything a solver could be tuned with is fixed HERE, before the evaluation
# seeds are touched. If a result is disappointing that is the result, not a
# reason to edit this file. Any change to it invalidates the comparison and
# requires a re-run reported as a new experiment.
#
# Provenance of the planner budgets: calibrated in FJ8.4a on the DEVELOPMENT
# states (101-105) of fj8_seeds.yaml, by inverting the measured generative
# calls-per-iteration rate and then measuring what the estimate realised. The
# realised values are recorded next to each budget. Iteration counts are an
# implementation detail of that calibration; the comparable unit is measured
# generative calls per decision.

protocol:
  seeds_file: fj8_seeds.yaml       # evaluation.episodes, 20 seeds, disjoint from dev
  horizon: 150                     # identical for all six solvers
  evaluator: evaluate_policy       # the same FJ7.6 harness for every family
  primary_operating_point: 1000    # measured gen calls per decision

# The six solvers of the primary comparison.
solvers:
  q_learning:
    family: tabular (learned)
    checkpoint: policies/q_learning/policy.npy
    config: policies/q_learning/training_config.yaml
    action_space: discrete

  sarsa:
    family: tabular (learned)
    checkpoint: policies/sarsa/policy.npy
    config: policies/q_learning/training_config.yaml
    action_space: discrete

  sac:
    family: deep (learned)
    checkpoint: policies/sac/policy.pt
    config: policies/sac/training_config.yaml
    action_space: continuous

  td3:
    family: deep (learned)
    checkpoint: policies/td3/policy.pt
    config: policies/td3/training_config.yaml
    action_space: continuous

  mcts:
    family: discrete online planning
    solver: MCTS.jl MCTSSolver
    config: policies/q_learning/training_config.yaml
    action_space: discrete
    n_iterations: 36               # FJ8.4a: realised 1006.8 gen/decision (+0.7 %)
    depth: 10                      # measured non-binding: depth 10 == depth 12
    exploration_constant: 5.0
    rollout: default random (MCTS.jl RolloutEstimator)
    reuse_tree: false
    planner_rng: 2026

  dpw:
    family: continuous online planning
    solver: MCTS.jl DPWSolver
    config: policies/sac/training_config.yaml
    action_space: continuous
    n_iterations: 35               # FJ8.4a: realised 1002.8 gen/decision (+0.3 %)
    depth: 10
    exploration_constant: 5.0
    enable_action_pw: true         # required: the action space is not enumerable
    enable_state_pw: false         # measured point-mass kernel on this baseline
    k_action: 4.0
    alpha_action: 0.5
    action_proposal: uniform in the action box (MCTS.jl RandomActionGenerator)
    keep_tree: false
    planner_rng: 2026

# Planner-only budget sensitivity. NOT extra rows of the six-solver table.
sensitivity:
  targets: [500, 1000, 2000]       # measured gen calls per decision
  mcts_iterations: [18, 36, 71]    # FJ8.4a realised: 494.2, 1006.8, 2009.4
  dpw_iterations: [18, 35, 70]     # FJ8.4a realised: 510.0, 1002.8, 2012.8
  seeds: 5                         # first five evaluation seeds; cost study only
  horizon: 60
